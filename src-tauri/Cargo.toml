[package]
name = "noetia"
version = "0.1.0"
description = "Um espaço local para ler Markdown e descobrir ideias"
edition = "2021"

[lib]
name = "noetia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
webbrowser = "1"

[[bin]]
name = "noetia"
path = "src/main.rs"
